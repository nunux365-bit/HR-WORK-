<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Flow — Operational HR Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=20261022_collapse_v1">
    <link rel="stylesheet" href="css/inbox.css?v=20261022_collapse_v1">
</head>
<body>

    <div class="app-shell">
        <!-- Shared Sidebar (loaded from js/sidebar.js) -->
        <div id="sidebarContainer"></div>
        <script src="js/sidebar.js?v=20261026_sidebar_v9"></script>

        <!-- ==================================================================
             MAIN OPERATIONAL WORKSPACE
             ================================================================== -->
        <div class="main-area inbox-main-area">
            <!-- Top Global Bar: Search / Role Selector / Notifications / User Area -->
            <header class="topbar">
                <div class="search-container">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="globalHeaderSearch" placeholder="Search across Cases, Employees, Emails (e.g. CASE-2026, EMP1023)...">
                </div>

                <div class="topbar-actions" style="display:flex; align-items:center; gap:12px;">
                    <!-- Operational Role Selector & Admin Role Switcher -->
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span style="font-size:0.72rem; font-weight:700; color:#475569;">ROLE:</span>
                        <select id="activeRoleSelect" title="Operational Role (Admin can switch or assign roles)" style="height:32px; padding:0 10px; border-radius:999px; border:1.5px solid #c7d2fe; font-size:0.75rem; font-weight:700; background:#ffffff; color:#312e81; cursor:pointer;">
                            <option value="ADMIN">ADMIN</option>
                            <option value="HR_MANAGER">HR_MANAGER</option>
                            <option value="HR_LEAD">HR_LEAD</option>
                            <option value="HR_AGENT">HR_AGENT</option>
                        </select>
                    </div>

                    <!-- Admin Auto-Reply Rule Status Pill -->
                    <div id="adminAutoReplyBadge" style="display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; background:#fef3c7; border:1px solid #fde68a; color:#92400e; font-size:0.72rem; font-weight:700;" title="Rule: If a user is logged in as Admin, auto-reply to incoming emails is disabled">
                        <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#d97706;"></span>
                        <span>Auto-Reply: OFF (Admin Rule)</span>
                    </div>

                    <!-- Phase 7.24 Notifications Button -->
                    <button type="button" class="btn-secondary-sm" id="btnOpenNotifications" style="position:relative; padding:6px 12px; font-size:0.8rem; display:inline-flex; align-items:center; gap:6px; border-radius:999px;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span>Notifications</span>
                        <span id="notifUnreadBadge" style="background:#ef4444; color:#fff; border-radius:999px; padding:1px 7px; font-size:0.7rem; font-weight:700; margin-left:2px;">0</span>
                    </button>

                    <div class="user-profile" style="border-left: 1px solid #e2e8f0; padding-left: 12px;">
                        <div class="user-avatar" id="userAvatar">AD</div>
                        <div class="user-info">
                            <span class="user-name" id="userName">Admin</span>
                            <span class="user-role" id="userRole">Admin</span>
                        </div>
                        <button type="button" class="btn-logout" id="logoutBtn" title="Sign out">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- ==============================================================
                 VIEW 1: GOOGLE LIQUID GLASS MAIL INBOX VIEW
                 ============================================================== -->
            <div id="moduleInboxView" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <!-- Sleek Single-Row Liquid Glass Command & Filter Bar -->
                <section class="inbox-top-section">
                    <div class="inbox-command-left">
                        <div class="inbox-title-left">
                            <h1>Inbox</h1>
                        </div>

                        <!-- Google-Style Liquid Glass Quick Filter Pills -->
                        <div class="inbox-stats-grid" role="tablist" aria-label="Quick Inbox Filters">
                            <div class="stat-compact-card blue active-stat" data-quick-status="ALL" title="Show all actionable HR messages">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                                <div class="stat-info">
                                    <strong>Actionable HR</strong>
                                </div>
                                <div class="stat-num" id="statTotalEmails">0</div>
                            </div>

                            <div class="stat-compact-card amber" data-quick-status="Needs Review" title="Emails requiring HR review">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                <div class="stat-info">
                                    <strong>Needs Review</strong>
                                </div>
                                <div class="stat-num" id="statNeedsReview">0</div>
                            </div>

                            <div class="stat-compact-card emerald" data-quick-status="Classified" title="Auto-classified HR emails">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                <div class="stat-info">
                                    <strong>Classified</strong>
                                </div>
                                <div class="stat-num" id="statClassified">0</div>
                            </div>

                            <div class="stat-compact-card purple" data-quick-status="Attachments" title="Emails with files attached">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                <div class="stat-info">
                                    <strong>Attachments</strong>
                                </div>
                                <div class="stat-num" id="statAttachments">0</div>
                            </div>

                            <div class="stat-compact-card" data-quick-status="Noise" title="Non-HR noise, bot alerts, OTPs & marketing filtered out" style="background:rgba(241, 245, 249, 0.7); border:1px solid #cbd5e1; color:#64748b;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                                <div class="stat-info">
                                    <strong style="color:#475569;">Filtered Noise</strong>
                                </div>
                                <div class="stat-num" id="statFilteredNoise" style="color:#64748b;">0</div>
                            </div>
                        </div>
                    </div>

                    <!-- Center Liquid Glass AI Panel Capsule -->
                    <div class="inbox-center-ai-dock">
                        <button type="button" class="ai-dock-pill ai-copilot-pill active" id="wsBtnToggleRhs" onclick="window.toggleWorkspaceZoneRhs && window.toggleWorkspaceZoneRhs()" title="Open / Close Right AI &amp; Case Copilot Panel">
                            <span class="ai-sparkle-orb">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                                    <path d="M12 2L14.6 9.4L22 12L14.6 14.6L12 22L9.4 14.6L2 12L9.4 9.4L12 2Z" fill="currentColor"/>
                                </svg>
                            </span>
                            <span class="ai-dock-label">AI Panel</span>
                            <span class="ai-dock-switch">
                                <span class="ai-live-dot"></span>
                            </span>
                        </button>
                    </div>

                    <!-- Sleek Liquid Glass Gmail Connection Capsule -->
                    <div class="gmail-connection-card">
                        <div class="gmail-conn-info">
                            <div class="gmail-conn-status">
                                <span class="conn-dot" id="connStatusDot"></span>
                                <strong id="connStatusTitle">Checking...</strong>
                            </div>
                            <span class="gmail-conn-email" id="connEmailAddress">Not connected</span>
                            <span class="gmail-conn-sync" id="connLastSync">Last sync: —</span>
                        </div>
                        <div class="gmail-conn-actions">
                            <button type="button" class="btn-sync-now" id="syncNowBtn">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                    <path d="M3 3v5h5"></path>
                                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                                    <path d="M16 21h5v-5"></path>
                                </svg>
                                <span id="syncNowLabel">Sync</span>
                            </button>
                            <button type="button" class="btn-icon-settings" id="inboxSettingsBtn" title="AI Models &amp; Pipeline Status">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- THREE WORKING ZONES -->
                <section class="inbox-three-zones">
                    <!-- ZONE 1: COLLAPSIBLE EMAIL LIST WINDOW (Full Glass Pane <-> 54px Liquid Glass Mini-Rail) -->
                    <div class="zone-email-list" id="zoneEmailListPane">
                        <!-- Mini-Rail Expand Button (Visible when collapsed) -->
                        <div class="queue-collapsed-rail-top">
                            <button type="button" class="btn-rail-expand-queue" id="btnExpandQueueRail" onclick="window.toggleWorkspaceZoneList && window.toggleWorkspaceZoneList()" title="Open Email List Window">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                                    <line x1="9" y1="3" x2="9" y2="21"></line>
                                    <polyline points="13 9 16 12 13 15"></polyline>
                                </svg>
                            </button>
                            <span class="rail-count-pill" id="emailRailCountBadge" title="Total emails in view">0</span>
                        </div>

                        <div class="list-controls">
                            <div class="list-header-bar">
                                <div class="list-header-title">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                                    </svg>
                                    <span>Messages</span>
                                    <span class="list-count-badge" id="emailListCountBadge" title="Filtered email count">0</span>
                                </div>
                                <button type="button" class="btn-collapse-queue" id="btnCollapseQueuePane" onclick="window.toggleWorkspaceZoneList && window.toggleWorkspaceZoneList()" title="Collapse Email List to Mini-Rail">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                                        <line x1="9" y1="3" x2="9" y2="21"></line>
                                        <polyline points="15 9 12 12 15 15"></polyline>
                                    </svg>
                                    <span>Collapse</span>
                                </button>
                            </div>

                            <div class="list-search-box">
                                <svg class="list-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input type="text" id="emailListSearch" placeholder="Search sender, subject, case...">
                            </div>
                            <div class="list-filter-row">
                                <select id="filterCategory" aria-label="Filter by category">
                                    <option value="ALL">All Categories</option>
                                    <option value="ATTENDANCE">Attendance</option>
                                    <option value="LEAVE">Leave</option>
                                    <option value="RESIGNATION">Resignation</option>
                                    <option value="BGV">BGV</option>
                                    <option value="PAYROLL">Payroll</option>
                                    <option value="ONBOARDING">Onboarding</option>
                                    <option value="DOCUMENTS">Documents</option>
                                    <option value="ASSET_IT">Asset &amp; IT</option>
                                    <option value="EMPLOYEE_PROFILE">Employee Profile</option>
                                    <option value="BENEFITS">Benefits</option>
                                    <option value="PERFORMANCE">Performance</option>
                                    <option value="GENERAL_HR">General HR</option>
                                    <option value="UNKNOWN">Unclassified</option>
                                </select>

                                <select id="filterStatus" aria-label="Filter by status">
                                    <option value="ALL">All Status</option>
                                    <option value="Unread">Unread</option>
                                    <option value="Read">Read</option>
                                    <option value="Needs Review">Needs Review</option>
                                    <option value="NEW">New</option>
                                    <option value="OPEN">Open</option>
                                    <option value="IN_PROGRESS">In Progress</option>
                                    <option value="ON_HOLD">On Hold</option>
                                    <option value="PENDING_APPROVAL">Pending Approval</option>
                                    <option value="REVIEW_REQUIRED">Review Required</option>
                                    <option value="RESOLVED">Resolved</option>
                                    <option value="CLOSED">Closed</option>
                                </select>

                                <select id="filterTime" aria-label="Filter by time">
                                    <option value="ALL">All Time</option>
                                    <option value="TODAY">Today</option>
                                    <option value="YESTERDAY">Yesterday</option>
                                    <option value="WEEK">This Week</option>
                                </select>
                            </div>
                        </div>

                        <div class="email-list-scroll" id="emailListScroll"></div>
                    </div>

                    <!-- ZONE 2: EMAIL READER -->
                    <div class="zone-email-reader" id="emailReaderZone"></div>

                    <!-- ZONE 3: RIGHT SIDE = HR / AI ACTION PANEL -->
                    <aside class="zone-hr-panel" id="hrActionZone"></aside>
                </section>
            </div>

            <!-- ==============================================================
                 VIEW 2: OPERATIONAL HR WORKSPACE MODULE VIEWS
                 (Cases / Tasks / Approvals / Workflows / Audit)
                 ============================================================== -->
            <div id="moduleOperationalView" style="display:none; flex-direction:column; flex:1; min-height:0; overflow-y:auto; padding:20px 24px; gap:18px;">
                <!-- Populated dynamically by inbox.js when switching sidebar modules -->
            </div>
            <script>
            (function () {
                var h = (window.location.hash || "").replace("#", "").trim();
                var ops = ["departments", "cases", "tasks", "approvals", "workflows", "actions", "reports", "users", "integrations", "audit", "builder"];
                if (ops.indexOf(h) !== -1) {
                    var iv = document.getElementById("moduleInboxView");
                    var ov = document.getElementById("moduleOperationalView");
                    if (iv) iv.style.display = "none";
                    if (ov) ov.style.display = "flex";
                }
            })();
            </script>
        </div>
    </div>

    <!-- Modal Dialog (Case Detail Workspace / Preview / Audit / Notifications) -->
    <div class="modal-backdrop" id="attachmentModal" style="display: none;">
        <div class="modal-dialog" id="modalDialogBox" style="max-width: 960px; width: 92%; max-height: 88vh; display:flex; flex-direction:column;">
            <div class="modal-header">
                <strong id="modalAttachmentTitle">Document Preview</strong>
                <button type="button" class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalAttachmentBody" style="overflow-y:auto; max-height:78vh;"></div>
        </div>
    </div>

    <script src="js/inbox.js?v=20261022_collapse_v1"></script>
    <script src="js/reports.js?v=20261019_tasks_v3"></script>
</body>
</html>
