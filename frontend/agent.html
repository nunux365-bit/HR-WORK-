<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Flow — HR Agent Execution Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=20261022_collapse_v1">
    <link rel="stylesheet" href="css/inbox.css?v=20261022_collapse_v1">
    <link rel="stylesheet" href="css/agent.css?v=20261022_collapse_v1">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="img/nexus-logo-64.png">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => null);
            });
        }
    </script>
    <style>
        #grokOrbContainer, .aura-bot-launcher, #nexusBotRoot, .grok-orb-container, #auraSideSheet {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- Shared Sidebar (loaded synchronously from js/sidebar.js) -->
        <div id="sidebarContainer"></div>
        <script src="js/sidebar.js?v=20261026_sidebar_v9"></script>

        <!-- ==================================================================
             MAIN HR AGENT EXECUTION WORKBENCH AREA
             ================================================================== -->
        <div class="main-area agent-main-area">
            <!-- Top Global Bar -->
            <header class="topbar agent-topbar">
                <div class="agent-topbar-left">
                    <nav class="agent-topbar-crumbs" aria-label="Breadcrumb">
                        <span class="crumb-parent">Operations</span>
                        <svg class="crumb-sep" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                        <span class="crumb-current">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                                <circle cx="12" cy="12" r="10"></circle>
                                <circle cx="12" cy="12" r="6"></circle>
                                <circle cx="12" cy="12" r="2"></circle>
                            </svg>
                            <span>HR Specialist Workbench</span>
                        </span>
                    </nav>

                    <div class="agent-topbar-pills">
                        <span id="topbarDeptPill" class="agent-dept-pill" title="Assigned Department">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                                <path d="M3 21h18"></path>
                                <path d="M9 8h1"></path><path d="M9 12h1"></path><path d="M9 16h1"></path>
                                <path d="M14 8h1"></path><path d="M14 12h1"></path><path d="M14 16h1"></path>
                                <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path>
                            </svg>
                            <span>HR Operations</span>
                        </span>
                    </div>
                </div>

                <div class="topbar-actions agent-topbar-actions">
                    <!-- Shown only when Admin / Manager / Lead is inspecting an Agent's Workbench -->
                    <a href="agentworktracker.html" id="btnBackToAgentsStatus" class="agent-btn-outline-top" style="display:none;">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>Back to Agents</span>
                    </a>

                    <div id="agentRoleSwitcherWrap" class="agent-role-pill-select" style="display:none;">
                        <span class="role-label">Role</span>
                        <select id="agentRoleSelect" title="Switch Operating Role (Admin)">
                            <option value="ADMIN">ADMIN</option>
                            <option value="HR_MANAGER">HR_MANAGER</option>
                            <option value="HR_LEAD">HR_LEAD</option>
                            <option value="HR_AGENT" selected>HR_AGENT</option>
                        </select>
                    </div>

                    <div id="agentSwitcherWrap" class="agent-role-pill-select" style="display:none;">
                        <span class="role-label">Agent</span>
                        <select id="agentProfileSelect" title="Switch HR Specialist Workbench">
                            <option value="">Loading Specialist...</option>
                        </select>
                    </div>

                    <div class="user-profile agent-user-profile-top">
                        <div class="user-avatar" id="userAvatar">AG</div>
                        <div class="user-info">
                            <span class="user-name" id="userName">HR Specialist</span>
                            <span class="user-role" id="userRole" title="HR Specialist / Agent">HR Specialist / Agent</span>
                        </div>
                        <button type="button" class="btn-logout" id="logoutBtn" title="Sign out">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Scrollable Workbench Content -->
            <div class="agent-scroll-workspace" id="agentWorkbenchRoot">
                <div style="padding:48px; text-align:center; color:#64748b; font-size:0.9rem; font-weight:600;">
                    Loading HR Specialist Execution Workbench...
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Switching Active Department (when specialist is assigned to 2 or more departments) -->
    <div id="agentDeptSwitchModal" class="agent-modal-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="deptModalTitle"></div>

    <!-- Modal for Logging a New Department HR Case -->
    <div id="agentNewCaseModal" class="agent-modal-backdrop" style="display:none;"></div>

    <!-- 360° Case Detail Workspace Modal (One UI 9.0 Admin Style) -->
    <div id="agentCaseDetailModal" class="agent-modal-backdrop" style="display:none;" role="dialog" aria-modal="true"></div>

    <!-- Reassign to Sub-Category Specialist Modal (Universal PeopleDesk Model) -->
    <div id="agentReassignModal" class="agent-modal-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="agentReassignModalTitle"></div>

    <script src="js/agent.js?v=20261027_resolution_v12"></script>
</body>
</html>
