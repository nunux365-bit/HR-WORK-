<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Flow — Agents Status &amp; Department Work Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/agentworktracker.css?v=20261008_standalone_v7">
    <script>
        // Cross-tab session persistence: ensure target="_blank" standalone canvas inherits active token & user identity
        try {
            const curToken = sessionStorage.getItem("hrflow_token");
            const curUser = sessionStorage.getItem("hrflow_user");
            if (!curToken) {
                const savedToken = localStorage.getItem("hrflow_last_token");
                if (savedToken) sessionStorage.setItem("hrflow_token", savedToken);
            }
            if (!curUser) {
                const savedUser = localStorage.getItem("hrflow_last_user");
                if (savedUser) sessionStorage.setItem("hrflow_user", savedUser);
            }
        } catch (_) {}
    </script>
</head>
<body class="awt-standalone-body">

    <!-- ==================================================================
         FULL-VIEWPORT STANDALONE CONTENT CANVAS (No Sidebar / No Topbar Chrome)
         ================================================================== -->
    <main class="awt-standalone-canvas" id="awtRootContainer">
        <div class="awt-loading-state">
            <div class="awt-loading-spinner"></div>
            <div>Loading Agents Status &amp; Department Work Telemetry...</div>
        </div>
    </main>

    <!-- 360° Agent Complete Work Dossier Modal -->
    <div id="awtAgentDossierModal" class="awt-modal-backdrop" style="display:none;"></div>

    <script src="js/agentworktracker.js?v=20261008_standalone_v7"></script>
</body>
</html>
