services:
  - type: web
    name: hr-flow-operations-portal
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m backend.database.init_db
    startCommand: gunicorn backend.server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"

